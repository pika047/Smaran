name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest :core:domain:test --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build debug and release
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Check the app requests no internet permission
        run: |
          echo "Libraries that asked for INTERNET (stripped by app manifest):"
          grep -h -B1 -A3 'android.permission.INTERNET' app/build/outputs/logs/manifest-merger-release-report.txt || true
          manifests=$(find app/build/intermediates -path '*release*' -name AndroidManifest.xml)
          echo "$manifests"
          test -n "$manifests"
          if grep -l 'android.permission.INTERNET' $manifests; then
            echo "::error::The merged manifest contains the INTERNET permission. v1 must stay offline."
            exit 1
          fi

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '**/build/reports/'
